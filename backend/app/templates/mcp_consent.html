<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distill — Connect to Claude</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 40px;
            max-width: 420px;
            text-align: center;
        }
        h1 { font-size: 1.4rem; margin: 0 0 8px; }
        p { color: #555; line-height: 1.5; }
        .email { font-weight: 600; color: #111; }
        .error { color: #b00020; }
        button {
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 32px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 16px;
        }
        button:hover { background: #4338ca; }
        .secondary {
            background: transparent;
            color: #555;
            border: 1px solid #d1d5db;
            margin-left: 8px;
        }
        .secondary:hover { background: #f9fafb; }
        .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Distill MCP</h1>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% else %}
            {% if user_email %}
                <p>Signed in as <span class="email">{{ user_email }}</span></p>
            {% endif %}
            <p>
                Claude is requesting access to your Distill clip library:
                ingesting Instagram reels, searching clips, and reading transcripts.
            </p>
            <div class="actions">
                <form method="post" action="/mcp-oauth/authorize">
                    <input type="hidden" name="client_id" value="{{ client_id }}">
                    <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
                    <input type="hidden" name="state" value="{{ state }}">
                    <input type="hidden" name="code_challenge" value="{{ code_challenge }}">
                    <button type="submit">Approve</button>
                </form>
                <form method="post" action="/mcp-oauth/logout">
                    <button type="submit" class="secondary">Sign out</button>
                </form>
            </div>
        {% endif %}
    </div>
</body>
</html>
