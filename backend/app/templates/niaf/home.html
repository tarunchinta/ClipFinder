<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ bench_name }}</title>
    <style>
        :root {
            --bg: #0a0a0b;
            --panel: #131316;
            --border: #27272a;
            --text: #fafafa;
            --muted: #a1a1aa;
            --accent: #f97316;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.6;
        }

        main {
            width: 100%;
            max-width: 560px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
        }

        .tag {
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
        }

        h1 {
            font-size: 32px;
            line-height: 1.2;
            margin: 12px 0 16px;
            letter-spacing: -0.02em;
        }

        p { color: var(--muted); }

        p + p { margin-top: 12px; }

        code {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            padding: 2px 6px;
        }

        @media (max-width: 480px) {
            main { padding: 28px 20px; }
            h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <main>
        <div class="tag">Placeholder</div>
        <h1>Hello, world.</h1>
        <p>
            This is the {{ bench_name }} home page. It is served from its own router
            at <code>/niaf</code>, separate from the Distill product pages and from
            the MCP server.
        </p>
        <p>
            Nothing here yet — the retrieval benchmark UI takes this page's place.
        </p>
    </main>
</body>
</html>
