services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: clipfinder
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://clipfinder:clipfinder@db:5432/clipfinder
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - REDIS_URL=redis://localhost:6379
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - STRIPE_TEST_KEY=${STRIPE_TEST_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=clipfinder
      - POSTGRES_PASSWORD=clipfinder
      - POSTGRES_DB=clipfinder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipfinder -d clipfinder"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
